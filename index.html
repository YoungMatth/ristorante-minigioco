<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Scacco Runner</title>

  <style>
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: linear-gradient(180deg,#ffffff,#f6f2ea);
      color:#111;
    }
    .wrap{max-width:560px;margin:0 auto;padding:16px}
    .card{
      background:#ffffff;
      border-radius:18px;
      padding:14px;
      margin-bottom:14px;
      box-shadow:0 14px 30px rgba(0,0,0,.08);
    }
    h1{margin:0;font-size:18px}
    canvas{
      width:100%;
      height:360px;
      border-radius:18px;
      display:block;
      background:#fdfaf4;
    }
    .hud{
      position:absolute;
      top:12px;
      right:12px;
      background:#ffffffdd;
      padding:10px 14px;
      border-radius:14px;
      font-weight:900;
      font-size:22px;
      box-shadow:0 10px 22px rgba(0,0,0,.1);
    }
    .btn{
      border:0;
      border-radius:14px;
      padding:10px 14px;
      font-weight:900;
      cursor:pointer;
      background:#111;
      color:white;
    }
    ol{margin:8px 0 0;padding-left:18px}
  </style>

  <!-- SUPABASE LIB -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
<div class="wrap">

  <div class="card">
    <h1>♟️ Scacco Runner</h1>
    <p>Tap per saltare i pedoni. Top 10 mensile.</p>
  </div>

  <div class="card" style="position:relative;">
    <canvas id="c"></canvas>
    <div class="hud">
      <span id="score">0</span>
    </div>
    <div style="margin-top:10px;text-align:right;">
      <button class="btn" id="restart">Ricomincia</button>
    </div>
    <div style="font-size:12px;color:#666;margin-top:6px;">
      Mese corrente: <span id="month"></span>
    </div>
  </div>

  <div class="card">
    <h2 style="margin:0;font-size:16px;">🏆 Top 10 del mese</h2>
    <ol id="board"></ol>
  </div>

</div>

<script>
  // CONFIG SUPABASE
  const SUPABASE_URL = "https://fhkqtcwvfgrvjmhoddj.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoa3F0Y3dmdmdydmptamhvZGRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE0MzU4NzgsImV4cCI6MjA4NzAxMTg3OH0.zMI_7B8T2ZVStv8uwr0fWXjCHGRd05GuLF53LlZ6eOs";

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ESPONIAMO GLOBALMENTE
  window.__sb = supabase;

  const monthKey = () => new Date().toISOString().slice(0,7);
  document.getElementById("month").textContent = monthKey();

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  async function loadBoard(){
    const { data, error } = await supabase
      .from("scores")
      .select("name,score,created_at")
      .eq("month_key", monthKey())
      .order("score", { ascending:false })
      .order("created_at", { ascending:true })
      .limit(10);

    const board = document.getElementById("board");
    board.innerHTML = "";

    if(error){
      board.innerHTML = "<li>Errore caricamento classifica</li>";
      return;
    }

    if(!data || data.length === 0){
      board.innerHTML = "<li>Nessun punteggio ancora</li>";
      return;
    }

    for(const r of data){
      const li = document.createElement("li");
      li.innerHTML = `<b>${escapeHtml(r.name)}</b> — ${r.score}`;
      board.appendChild(li);
    }
  }

  supabase
    .channel("scores-live")
    .on("postgres_changes", { event:"INSERT", schema:"public", table:"scores" }, loadBoard)
    .subscribe();

  loadBoard();
</script>

<script src="./game.js"></script>
</body>
</html>
