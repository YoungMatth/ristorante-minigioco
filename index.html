<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Scacco Runner</title>

  <style>
    :root{
      --bg1:#fbf7f0;
      --bg2:#f3efe7;
      --ink:#141414;
      --muted:#6b6b6b;
      --card:rgba(255,255,255,.75);
      --stroke:rgba(0,0,0,.08);
      --gold:#b08d57;
      --shadow:0 16px 40px rgba(0,0,0,.10);
      --r:18px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--ink);
      background:
        radial-gradient(1200px 600px at 20% 0%, #fff, transparent 60%),
        radial-gradient(900px 500px at 90% 10%, var(--bg2), transparent 55%),
        linear-gradient(180deg, #fff, var(--bg1));
    }
    .wrap{ max-width:560px; margin:0 auto; padding:16px; }
    .topbar{ display:flex; gap:12px; align-items:flex-start; justify-content:space-between; margin-bottom:12px; }
    .brand{
      flex:1;
      background:var(--card);
      border:1px solid var(--stroke);
      border-radius:var(--r);
      padding:12px 14px;
      box-shadow:var(--shadow);
      backdrop-filter: blur(8px);
    }
    .brand h1{ margin:0; font-size:18px; letter-spacing:.2px; }
    .brand p{ margin:6px 0 0; color:var(--muted); font-size:13px; line-height:1.35; }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:10px 12px;
      border-radius:999px;
      border:1px solid var(--stroke);
      background:var(--card);
      box-shadow:var(--shadow);
      font-weight:800;
      white-space:nowrap;
    }
    .pill .dot{ width:8px; height:8px; border-radius:50%; background:var(--gold); }

    .card{
      background:var(--card);
      border:1px solid var(--stroke);
      border-radius:var(--r);
      padding:12px;
      box-shadow:var(--shadow);
      margin-bottom:12px;
      backdrop-filter: blur(8px);
    }

    .stage{
      position:relative;
      border-radius: calc(var(--r) + 4px);
      overflow:hidden;
      border:1px solid var(--stroke);
      background: linear-gradient(180deg,#fff,#f7f3ec);
    }
    canvas{
      width:100%;
      height:360px;
      display:block;
      touch-action: manipulation;
    }
    .scoreBox{
      position:absolute; top:12px; right:12px;
      background:rgba(255,255,255,.86);
      border:1px solid var(--stroke);
      border-radius:14px;
      padding:10px 12px;
      box-shadow: 0 12px 26px rgba(0,0,0,.10);
      min-width:140px;
      text-align:right;
      pointer-events:none;
    }
    .scoreBox .label{
      font-size:11px; color:var(--muted);
      letter-spacing:.12em; text-transform:uppercase;
    }
    .scoreBox .val{
      font-size:26px; font-weight:900; line-height:1;
      margin-top:4px;
    }

    .bottomBar{
      display:flex; gap:10px; align-items:center; justify-content:space-between;
      margin-top:10px; flex-wrap:wrap;
    }
    .btn{
      border:0;
      border-radius:14px;
      padding:10px 12px;
      font-weight:900;
      cursor:pointer;
      background: var(--ink);
      color:#fff;
      box-shadow: 0 12px 24px rgba(0,0,0,.14);
    }
    .btn:active{ transform:scale(.99); }
    .hint{ color:var(--muted); font-size:13px; }
    .foot{ color:var(--muted); font-size:12px; margin-top:8px; }

    ol{ margin:10px 0 0; padding-left:18px; }
    #board li{
      display:flex;
      justify-content:space-between;
      gap:10px;
      padding:8px 10px;
      border-radius:12px;
    }
    #board li:nth-child(odd){ background: rgba(0,0,0,0.03); }
    #board li:first-child{
      background: rgba(176,141,87,0.20);
      font-weight:900;
    }
  </style>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <h1>♟️ Scacco Runner</h1>
        <p>
          Tap per saltare i pedoni. <b>Top 10 del mese</b>. #1 a fine mese = cena premio.
        </p>
      </div>
      <div class="pill"><span class="dot"></span> Tap to jump</div>
    </div>

    <div class="card">
      <div class="stage">
        <canvas id="c"></canvas>
        <div class="scoreBox">
          <div class="label">Punteggio</div>
          <div class="val" id="score">0</div>
        </div>
      </div>
      <div class="bottomBar">
        <div class="hint">Consiglio: salta “tardi” per fare più punti.</div>
        <button class="btn" id="restart">Ricomincia</button>
      </div>
      <div class="foot">Mese corrente: <span id="month"></span></div>
    </div>

    <div class="card">
      <h2 style="margin:0;font-size:16px;">🏆 Top 10 del mese</h2>
      <ol id="board"></ol>
      <div class="foot">Suggerimento: aggiungi le regole premio nel menù (validità, un premio per persona, ecc.).</div>
    </div>
  </div>

  <script>
    // ==== SUPABASE CONFIG ====
    const SUPABASE_URL = "https://fhkqtcwvfgrvjmhoddj.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoa3F0Y3dmdmdydmptamhvZGRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE0MzU4NzgsImV4cCI6MjA4NzAxMTg3OH0.zMI_7B8T2ZVStv8uwr0fWXjCHGRd05GuLF53LlZ6eOs";

    // Esponiamo anche URL/KEY per fallback in game.js (anti "manca Supabase")
    window.__SUPABASE_URL = SUPABASE_URL;
    window.__SUPABASE_KEY = SUPABASE_ANON_KEY;

    // Creiamo client
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    window.__sb = sb;

    const monthKey = () => new Date().toISOString().slice(0,7);
    document.getElementById("month").textContent = monthKey();

    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, (c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function loadBoard(){
      const mk = monthKey();
      const { data, error } = await sb
        .from("scores")
        .select("name,score,created_at")
        .eq("month_key", mk)
        .order("score", { ascending:false })
        .order("created_at", { ascending:true })
        .limit(10);

      const board = document.getElementById("board");
      board.innerHTML = "";

      if (error){
        const li = document.createElement("li");
        li.textContent = "Errore nel caricare la classifica.";
        board.appendChild(li);
        return;
      }
      if (!data || data.length === 0){
        const li = document.createElement("li");
        li.textContent = "Nessun punteggio ancora. Sii il primo!";
        board.appendChild(li);
        return;
      }

      data.forEach((r, i) => {
        const li = document.createElement("li");
        const medal = i === 0 ? "🥇 " : (i === 1 ? "🥈 " : (i === 2 ? "🥉 " : ""));
        li.innerHTML = `<span><b>${medal}${escapeHtml(r.name)}</b></span><span>${r.score}</span>`;
        board.appendChild(li);
      });
    }

    // Live updates
    sb.channel("scores-live")
      .on("postgres_changes", { event:"INSERT", schema:"public", table:"scores" }, loadBoard)
      .subscribe();

    loadBoard();
  </script>

  <script src="./game.js"></script>
</body>
</html>
